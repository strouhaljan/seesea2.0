"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
# .env is copied into new workspaces by Conductor's default `.env*` pattern;
# fall back to the example (e.g. in cloud workspaces) so Vite has the keys.
setup = """
[ -f .env ] || cp .env.example .env
npm ci
npm --prefix server ci
"""
# Each workspace gets its own ports and its own server/cache.db.
run_mode = "concurrent"

# Vite on $CONDUCTOR_PORT, API server on $CONDUCTOR_PORT+1 (Vite proxies /api to it).
[scripts.run.dev]
available_in = [ "local" ]
command = """
set -a; [ -f .env ] && . ./.env; set +a
API_PORT=$((CONDUCTOR_PORT + 1))
exec npx concurrently --kill-others --names web,api --prefix-colors cyan,magenta \
  "API_TARGET=http://localhost:$API_PORT npm run dev -- --port $CONDUCTOR_PORT" \
  "PORT=$API_PORT EVENTS=${EVENTS:-vr-2026} npm --prefix server run dev"
"""
default = true
icon = "play"
