server {
    # Same port the Vite dev server used, so the reverse proxy in front needs no change
    listen       5173;
    server_name  _;
    root         /usr/share/nginx/html;

    gzip            on;
    gzip_min_length 1024;
    gzip_types      text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Docker's DNS; resolving per request lets nginx start before the API container
    resolver 127.0.0.11 valid=30s;

    location /api/ {
        set $api http://server:3001;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-side routes such as /e/<slug>
    location / {
        try_files $uri $uri/ /index.html;
    }

    # New deploys must be picked up: never cache the HTML shell or the service worker
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Vite hashed assets – immutable, cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
