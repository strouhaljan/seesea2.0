version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_MAPBOX_TOKEN=${VITE_MAPBOX_TOKEN}
    ports:
      - "5173:5173"
    depends_on:
      - server

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    volumes:
      - server-data:/app/data
    environment:
      - PORT=3001
      - CACHE_DB_PATH=/app/data/cache.db
      - EVENTS=${EVENTS:-vr-2026}

volumes:
  server-data: